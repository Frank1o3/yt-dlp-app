id: io.github.Frank1o3.YtDlpApp

runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk

base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'

command: yt-dlp-app

cleanup-commands:
  - /app/cleanup-BaseApp.sh

build-options:
  env:
    BASEAPP_REMOVE_WEBENGINE: '1'

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-download
  - --share=network

modules:
  - name: ffmpeg-install
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/ffmpeg

  - pypi-dependencies.json
  - hatchling.json

  - name: yt-dlp-app
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-build-isolation --no-deps --prefix=${FLATPAK_DEST} .
      - install -Dm644 packaging/flatpak/io.github.Frank1o3.YtDlpApp.desktop /app/share/applications/io.github.Frank1o3.YtDlpApp.desktop
      - install -Dm644 packaging/flatpak/io.github.Frank1o3.YtDlpApp.metainfo.xml /app/share/metainfo/io.github.Frank1o3.YtDlpApp.metainfo.xml
      - install -Dm644 packaging/flatpak/icon.svg /app/share/icons/hicolor/scalable/apps/io.github.Frank1o3.YtDlpApp.svg
    sources:
      - type: dir
        path: ../..