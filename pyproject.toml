[project]
    dependencies=["PyQt6>=6.6.0", "yt-dlp>=2026.8.19"]
    description="Simple PyQt6 GUI front-end for yt-dlp"
    name="yt-dlp-app"
    readme="README.md"
    requires-python=">=3.13"
    version="0.1.0"

    [project.scripts]
        yt-dlp-app="yt_dlp_app.main:main"

[build-system]
    build-backend="hatchling.build"
    requires=["hatchling"]

[tool.hatch.build.targets.wheel]
    packages=["src/yt_dlp_app"]
